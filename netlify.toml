[build]
  command = "corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm --dir frontend build"
  publish = "frontend/dist"

[build.environment]
  VITE_API_URL = "https://cafe-smart-api.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200