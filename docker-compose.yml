version: '3.8'

services:
  # Backend (NestJS + Prisma + Supabase)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cafe_smart_backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env

  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cafe_smart_frontend
    ports:
      - "80:80"
    depends_on:
      - backend